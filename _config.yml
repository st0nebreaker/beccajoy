# Site settings
title: Becca Joy
tagline: Portfolio
slug: Product Designer · UX / Front End Engineer · Project Manager
description: >
  Designer, engineer, and project manager at the intersection of tech
  and mission-driven work. Six years building user-facing software,
  with a decade of experience in nonprofits and conservation organizations.
url: https://beccajoy.pages.dev
baseurl: ""

# Author
author:
  name: Becca Steinbrecher
  email: # your email here
  phone: "(858) 431-6492"
  picture: /assets/img/becca-portrait.png
  about: |
    Product Designer, UX  Engineer & Project Manager connecting product strategy,
    thoughtful design, and hands-on development for mission-driven teams.

accent_image: /assets/img/sidebar-art.png
accent_color: rgb(180, 89, 56)
theme_color: rgb(42, 36, 32)

# Fonts — Google Fonts
google_fonts: DM+Serif+Display:400,400i|Inter:300,400,500,600
font:         "'Inter', system-ui, sans-serif"
font_heading: "'DM Serif Display', Georgia, serif"
font_code:    "'JetBrains Mono', 'Fira Mono', monospace"

# Navigation
menu:
  - title: About
    url:   /
  - title: Resume
    url:   /resume/
  - title: Work
    url:   /work/

# Collections
collections:
  work:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
      type: work
    values:
      layout: case-study

# Social links (edit to add yours)
links:
  - title: LinkedIn
    url:   https://www.linkedin.com/in/becca-steinbrecher  # update with real URL
  - title: GitHub
    url:   https://github.com/bsteinbrecher               # update with real URL

# Hydejack options
hydejack:
  post_addons:   [about, newsletter, related, random]
  project_addons: [about, newsletter, other]
  no_mark_external: false
  no_push_state:    false
  no_drawer:        false
  no_navbar:        false
  no_search:        true
  no_inline_css:    false
  no_page_style:    false
  no_cover_group:   false
  hide_dates:       true
  hide_image_in_post: false
  dark_mode:
    always: false
    dynamic: false
    icon: false

# Markdown + plugins
markdown:    kramdown
highlighter: rouge

kramdown:
  input:         GFM
  math_engine:   mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-include-cache

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
