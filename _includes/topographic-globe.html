<figure class="topographic-globe" data-topographic-globe>
  <div class="topographic-globe__surface" role="group" aria-label="Explore my case studies on a topographic globe">
    <canvas class="topographic-globe__canvas" width="560" height="560" aria-hidden="true"></canvas>
    <div class="topographic-globe__markers">
      {% assign globe_work = site.work | sort: 'title' %}
      {% for project in globe_work %}
        <a class="topographic-globe__marker" href="{{ project.url | relative_url }}" data-project-index="{{ forloop.index0 }}">
          <span class="sr-only">{{ project.title }}</span>
          <span class="topographic-globe__label" aria-hidden="true">{{ project.title | split: ' – ' | first }}</span>
        </a>
      {% endfor %}
    </div>
  </div>
  <figcaption class="topographic-globe__caption">
    <span class="topographic-globe__eyebrow">A world of thoughtful work</span>
    <span class="topographic-globe__hint">Select a point to explore</span>
  </figcaption>
</figure>
