<div class="sidebar-sticky">
  <div class="sidebar-about">
    {% if site.logo %}
      <a class="no-hover" href="{{ '/' | relative_url }}" tabindex="-1">
        <img src="{% include_cached smart-url url=site.logo %}" class="avatar" alt="{{ site.short_title | default:site.title }}" width="120" height="120" loading="lazy" />
      </a>
    {% endif %}
    <a class="sidebar-title" href="{{ '/' | relative_url }}">
      <h2 class="h1 sidebar-name">
        Becca <span class="sidebar-name__joy">[Joy]</span><br>
        Steinbrecher
      </h2>
    </a>
    {% assign text = Product Designer · UX / Front End Engineer · Project Manager | default:site.slug %}
    {% if text %}
      <p class="{% if text.size > 100 %}fine{% endif %}">
        {{ text | markdownify | replace:'<p>','' | replace:'</p>','' }}
      </p>
    {% endif %}
  </div>

  <nav class="sidebar-nav heading" role="navigation">
    {% include body/nav.html %}
  </nav>

  <div class="sidebar-contact">
    <h2>Contact</h2>
    <a class="no-mark-external" href="https://github.com/st0nebreaker" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="mailto:beccasteinbrecher@gmail.com">Email</a>
  </div>
</div>
