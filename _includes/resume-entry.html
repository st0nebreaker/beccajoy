<details class="resume-entry">
  <summary class="resume-entry-header">
    <div class="resume-entry-title">
      <strong class="resume-company">{{ include.company }}</strong>
      <span class="resume-role">{{ include.role }}</span>
    </div>

    <span class="resume-entry-meta">
      {% if include.period %}<span class="resume-period">{{ include.period }}</span>{% endif %}
      <span class="resume-toggle-icon" aria-hidden="true"></span>
    </span>
  </summary>

  {% if include.bullets %}
    <ul class="resume-bullets">
      {% assign bullet_list = include.bullets | split: "|" %}
      {% for bullet in bullet_list %}
        <li>{{ bullet | strip }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</details>
